name: Publish approved social posts

# SPARE ALARM CLOCK. Since 16 September 2026 the publisher is woken every 15
# minutes by a Cloudflare Worker (workers/publish-cron) — GitHub ran this
# schedule 4 times in 96 that day. This stays as a backup; the publisher's
# claim means both arriving at once still sends a post only once.

# Vercel's Hobby plan allows one cron, and it is already spoken for by the
# morning email run. This gives the content queue its own schedule so a post
# goes out close to the time Kristina set, not only at 9am.
#
# Needs two repository secrets:
#   SITE_URL     e.g. https://www.beautasy.co.uk
#   CRON_SECRET  the same value as the CRON_SECRET set in Vercel

on:
  schedule:
    # Every 15 minutes, off the hour.
    #
    # This used to be two runs, at 11:00 and 18:00 UTC. GitHub runs scheduled
    # workflows on a best-effort queue that is busiest on the hour, and over
    # 9–15 September 2026 those runs arrived a median of 2h19m (18:00) and
    # 3h54m (11:00) late — the longest nearly six hours. A post set for 21:21
    # sat approved and due with nothing coming to send it.
    #
    # Frequent runs at odd minutes mean a late one is soon followed by another,
    # so a post leaves within minutes of its time. Frequency does not turn into
    # volume: the publisher sends at most one post in 20 hours however often it
    # is asked. Public repository, so these minutes cost nothing.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# A slow run and the next one must not both be sending. The publisher's claim
# already stops a double post; this stops them queueing up behind each other.
concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Send anything approved and due
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ secrets.SITE_URL }}/api/social/publish")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Publish endpoint returned $code"
            exit 1
          fi
