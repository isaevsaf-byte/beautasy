name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Tests
        run: npm test

      # Stripe, Clerk and Resend are initialised lazily at request time, so
      # they need nothing here. Sanity does: the dataset is private, and the
      # build prerenders product, collection and info pages from it. Without
      # the token every fetch is caught and the build still passes — with
      # empty pages, which is worse than a red build. Keep the secret set.
      - name: Build
        run: npm run build
        env:
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
