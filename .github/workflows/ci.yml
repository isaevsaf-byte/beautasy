name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Tests
        run: npm test

      # No secrets needed: Sanity reads come from the public CDN, and Stripe,
      # Clerk and Resend are all initialised lazily at request time.
      - name: Build
        run: npm run build
